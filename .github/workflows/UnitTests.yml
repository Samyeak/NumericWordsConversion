name: Unit Tests

on: [push, pull_request, release]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.406
      - name: Run Unit Tests
        run: dotnet test
